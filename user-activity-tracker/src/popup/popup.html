<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>User Activity Tracker</title>
    <!-- Inter font via system fallback (no external CSP issues) -->
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="popup-container">
      <!-- Header -->
      <header class="popup-header">
        <div class="header-left">
          <div class="logo-icon" id="logo-icon">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
              <circle cx="9" cy="9" r="8" stroke="#34DED3" stroke-width="1.5" />
              <circle cx="9" cy="9" r="3" fill="#34DED3" />
            </svg>
          </div>
          <span class="header-title">Activity Tracker</span>
        </div>
        <div class="tracking-toggle-wrap">
          <label class="toggle-label" for="tracking-toggle" id="toggle-label">On</label>
          <label class="toggle" title="Toggle tracking">
            <input type="checkbox" id="tracking-toggle" checked />
            <span class="slider"></span>
          </label>
        </div>
      </header>

      <!-- Status Badge -->
      <div class="status-row" id="status-row">
        <span class="status-dot" id="status-dot"></span>
        <span class="status-text" id="status-text">Tracking active</span>
        <span class="current-site" id="current-site"></span>
      </div>

      <!-- Live Visualization Panel -->
      <div class="overlay-panel" id="overlay-panel">
        <div class="overlay-panel-header">
          <div class="overlay-title-wrap">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
              <circle cx="7" cy="7" r="5.5" stroke="#34DED3" stroke-width="1.2" />
              <circle cx="7" cy="7" r="2" fill="#34DED3" />
            </svg>
            <span class="overlay-title">Live Visualization</span>
          </div>
          <div class="tracking-toggle-wrap">
            <label class="toggle-label" for="overlay-toggle" id="overlay-toggle-label">On</label>
            <label class="toggle" title="Toggle Live Visualization">
              <input type="checkbox" id="overlay-toggle" checked />
              <span class="slider"></span>
            </label>
          </div>
        </div>

        <!-- Sub-feature Toggles -->
        <div class="overlay-sub-options" id="overlay-sub-options">
          <label class="sub-toggle-item">
            <span class="sub-toggle-name">Mouse Trail</span>
            <input type="checkbox" id="toggle-mouse-trail" checked />
            <span class="sub-toggle-check"></span>
          </label>
          <label class="sub-toggle-item">
            <span class="sub-toggle-name">Click Heatmap</span>
            <input type="checkbox" id="toggle-click-heatmap" checked />
            <span class="sub-toggle-check"></span>
          </label>
          <label class="sub-toggle-item">
            <span class="sub-toggle-name">Scroll Trail</span>
            <input type="checkbox" id="toggle-scroll-trail" checked />
            <span class="sub-toggle-check"></span>
          </label>

          <!-- Clear Current Page Activity Action -->
          <div class="clear-page-wrap">
            <button class="clear-page-btn" id="clear-page-overlay-btn" title="Remove the current page's visual overlay">
              <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
                <path d="M2.5 3.5H9.5M4.5 3.5V2C4.5 1.72 4.72 1.5 5 1.5H7C7.28 1.5 7.5 1.72 7.5 2V3.5M8.5 3.5V9.5C8.5 9.78 8.28 10 8 10H4C3.72 10 3.5 9.78 3.5 9.5V3.5" stroke="#6B7280" stroke-width="1.1" stroke-linecap="round"/>
              </svg>
              Clear Page Activity
            </button>
            <span class="clear-status-msg" id="clear-status-msg"></span>
          </div>
        </div>
      </div>

      <!-- Stats Grid -->
      <div class="stats-grid">
        <div class="stat-card" id="stat-time">
          <div class="stat-value" id="active-time">0m</div>
          <div class="stat-label">Active time</div>
        </div>
        <div class="stat-card" id="stat-visits">
          <div class="stat-value" id="total-visits">0</div>
          <div class="stat-label">Page visits</div>
        </div>
        <div class="stat-card" id="stat-clicks">
          <div class="stat-value" id="total-clicks">0</div>
          <div class="stat-label">Clicks</div>
        </div>
      </div>

      <!-- Current Page -->
      <div class="current-page-section" id="current-page-section" style="display:none;">
        <div class="section-label">Currently on</div>
        <div class="current-page-url" id="current-page-url"></div>
      </div>

      <!-- Open Dashboard Button -->
      <button class="open-dashboard-btn" id="open-dashboard">
        <svg width="15" height="15" viewBox="0 0 15 15" fill="none">
          <rect x="1" y="1" width="5.5" height="5.5" rx="1" stroke="#34DED3" stroke-width="1.3" />
          <rect x="8.5" y="1" width="5.5" height="5.5" rx="1" stroke="#34DED3" stroke-width="1.3" />
          <rect x="1" y="8.5" width="5.5" height="5.5" rx="1" stroke="#34DED3" stroke-width="1.3" />
          <rect x="8.5" y="8.5" width="5.5" height="5.5" rx="1" stroke="#34DED3" stroke-width="1.3" />
        </svg>
        Open Dashboard
      </button>
    </div>

    <!-- Script injected by HtmlWebpackPlugin -->
  </body>
</html>
